name: Publish demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: scripts/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
      - name: Build template and example
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --no-pub --base-href="/$REPOSITORY_NAME/" --output=build/pages
          flutter build web --no-pub --target=lib/demo.dart --base-href="/$REPOSITORY_NAME/gacha/" --output=build/pages/gacha
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
