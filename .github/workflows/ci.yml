name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: scripts/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: scripts/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: scripts/device-test.sh emulator-5554
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: scripts/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
      - name: Boot iOS simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          device_id=$(xcrun simctl list devices available --json | jq -er '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) |
             select(any(.value[]; .name | startswith("iPhone")))]
            | max_by(.key | split(".iOS-")[1] | split("-") | map(tonumber))
            | [.value[] | select(.name | startswith("iPhone"))][0].udid
          ')
          echo "IOS_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Run iOS UI tests
        timeout-minutes: 20
        run: scripts/ios-simulator-test.sh "$IOS_SIMULATOR_ID"
      - name: Shut down iOS simulator
        if: always() && env.IOS_SIMULATOR_ID != ''
        run: xcrun simctl shutdown "$IOS_SIMULATOR_ID" || true
      - run: flutter build ios --simulator --debug
      - name: Package iOS simulator build
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ios-simulator.zip
          if-no-files-found: error
