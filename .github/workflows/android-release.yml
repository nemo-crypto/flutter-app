name: Build signed Android bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Android versionCode (greater than the version already distributed)
        required: true
        type: number

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: scripts/install-flutter.sh
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build and verify signed AAB
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || (( BUILD_NUMBER > 2100000000 )); then
            echo "Enter an Android build number between 1 and 2100000000." >&2
            exit 1
          fi
          : "${KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Configure ANDROID_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD}"
          umask 077
          trap 'rm -f android/upload.jks android/key.properties' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          python3 scripts/write-signing-properties.py
          flutter build appbundle --release --no-pub --build-number="$BUILD_NUMBER"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | grep -F 'jar verified.'
      - uses: actions/upload-artifact@v7
        with:
          name: android-signed-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
